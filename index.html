  <!-- Google Fonts: Inter & Plus Jakarta Sans -->

  <style>
    /* =========================================================================
       ESTÉTICA EDITORIAL MINIMALISTA (REFERÊNCIA LUCAS GUERRA)
    ========================================================================= */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    :root {
      --bg: #111111;
      --surface: #181818;
      --text: #ffffff;
      --muted: #999999;
      --muted-hover: #e5e5e5;
      --gap: 28px;
      --max-width: 1440px;
      --transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    html {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    ::selection {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }

    /* =========================================================================
       CABEÇALHO EM LINHA ÚNICA (BRAND À ESQ, NAV NO CENTRO, SOCIAIS À DIR)
    ========================================================================= */
    .site-header {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 44px 48px 48px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
    }

    .brand {
      justify-self: start;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #ffffff;
      transition: opacity var(--transition);
    }

    .brand:hover {
      opacity: 0.8;
    }

    .nav-links {
      justify-self: center;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-btn {
      font-size: 0.88rem;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: -0.01em;
      padding: 4px 2px;
      position: relative;
      transition: color var(--transition);
    }

    .nav-btn:hover {
      color: var(--muted-hover);
    }

    .nav-btn.is-active {
      color: #ffffff;
    }

    .nav-btn.is-active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;
      height: 1px;
      background-color: #ffffff;
    }

    .social-links {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      opacity: 0.8;
      padding: 4px;
      transition: opacity var(--transition), transform var(--transition);
    }

    .social-link:hover {
      opacity: 1;
      transform: translateY(-1px);
    }

    .social-link svg {
      width: 17px;
      height: 17px;
      display: block;
    }

    /* =========================================================================
       CONTAINER PRINCIPAL & GRADE MASONRY EDITORIAL (3 COLUNAS)
    ========================================================================= */
    .main-container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 48px 96px;
    }

    .masonry-grid {
      column-count: 3;
      column-gap: var(--gap);
    }

    .masonry-item {
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
      margin-bottom: var(--gap);
      position: relative;
      display: block;
      width: 100%;
      overflow: hidden;
      background-color: var(--surface);
      cursor: pointer;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Proporções cinematográficas alternadas */
    .ratio-16-9 { aspect-ratio: 16 / 9; }
    .ratio-4-3  { aspect-ratio: 4 / 3; }
    .ratio-21-9 { aspect-ratio: 21 / 9; }
    .ratio-3-2  { aspect-ratio: 3 / 2; }
    .ratio-16-10 { aspect-ratio: 16 / 10; }

    .masonry-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), filter 0.4s ease;
    }

    .masonry-item:hover .masonry-media {
      transform: scale(1.025);
      filter: brightness(0.85);
    }

    /* Overlay minimalista visível apenas no hover */
    .masonry-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.65) 0%,
        rgba(0, 0, 0, 0.1) 50%,
        rgba(0, 0, 0, 0) 100%
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 16px 18px;
      pointer-events: none;
    }

    .masonry-item:hover .masonry-overlay,
    .masonry-item:focus-visible .masonry-overlay {
      opacity: 1;
    }

    .masonry-title {
      font-size: 0.8rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.95);
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 85%;
    }

    .play-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .masonry-item:hover .play-indicator,
    .masonry-item:focus-visible .play-indicator {
      opacity: 0.95;
      transform: translate(-50%, -50%) scale(1);
    }

    .play-indicator svg {
      width: 28px;
      height: 28px;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.6));
    }

    /* =========================================================================
       SEÇÃO SOBRE (MINIMALISTA EDITORIAL — OCULTA POR PADRÃO)
    ========================================================================= */
    .about-section {
      display: none;
      max-width: 640px;
      margin: 64px auto 60px;
      animation: fadeUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .about-section.is-visible {
      display: block;
    }

    .about-text {
      font-size: 1.08rem;
      line-height: 1.8;
      color: #d4d4d4;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .about-text strong {
      color: #ffffff;
      font-weight: 600;
    }

    .about-links {
      margin-top: 48px;
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      align-items: center;
    }

    .about-link {
      font-size: 0.88rem;
      color: var(--muted);
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      padding-bottom: 4px;
      transition: color var(--transition), border-color var(--transition);
    }

    .about-link:hover {
      color: #ffffff;
      border-color: #ffffff;
    }

    .copy-toast {
      font-size: 0.78rem;
      color: #22c55e;
      margin-left: 8px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .copy-toast.is-visible {
      opacity: 1;
    }

    /* =========================================================================
       LIGHTBOX CINEMA (MODAL 16:9 FULL-SCREEN & IMAGEM)
    ========================================================================= */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background-color: rgba(10, 10, 10, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 64px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .lightbox.is-open {
      opacity: 1;
      visibility: visible;
    }

    .lightbox-stage {
      width: 100%;
      max-width: 1140px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }

    .lightbox-video-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000000;
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
      border-radius: 4px;
    }

    /* Oculta a barra superior (avatar e título do canal do YouTube) */
    .lightbox-video-wrap iframe {
      position: absolute;
      top: -11%;
      left: 0;
      width: 100%;
      height: 112%;
      border: 0;
    }

    .lightbox-image-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-image {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
      display: block;
    }

    .lightbox-close {
      position: fixed;
      top: 24px;
      right: 28px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999999;
      transition: color var(--transition);
      z-index: 105;
    }

    .lightbox-close:hover {
      color: #ffffff;
    }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.55);
      transition: color var(--transition), transform var(--transition);
      z-index: 105;
    }

    .lightbox-nav:hover {
      color: #ffffff;
    }

    .lightbox-prev { left: 16px; }
    .lightbox-next { right: 16px; }

    /* =========================================================================
       RESPONSIVIDADE
    ========================================================================= */
    @media (max-width: 1024px) {
      .site-header {
        padding: 32px 28px 36px;
      }

      .main-container {
        padding: 0 28px 64px;
      }

      .masonry-grid {
        column-count: 2;
        column-gap: 20px;
      }

      .masonry-item {
        margin-bottom: 20px;
      }

      .lightbox {
        padding: 32px 48px;
      }
    }

    @media (max-width: 680px) {
      .site-header {
        padding: 24px 20px 28px;
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "brand social"
          "nav nav";
        row-gap: 18px;
      }

      .brand {
        grid-area: brand;
      }

      .social-links {
        grid-area: social;
        gap: 14px;
      }

      .nav-links {
        grid-area: nav;
        justify-self: start;
        gap: 18px;
      }

      .main-container {
        padding: 0 20px 56px;
      }

      .masonry-grid {
        column-count: 1;
        column-gap: 0;
      }

      .masonry-item {
        margin-bottom: 18px;
      }

      .about-section {
        margin: 32px auto 40px;
      }

      .lightbox {
        padding: 56px 16px 24px;
      }

      .lightbox-close {
        top: 12px;
        right: 12px;
      }

      .lightbox-nav {
        top: auto;
        bottom: 16px;
        transform: none;
      }

      .lightbox-prev { left: 16px; }
      .lightbox-next { right: 16px; }
    }
  </style>
</head>
<body>

  <!-- =========================================================================

    <!-- Seção Sobre (visível apenas na aba 'sobre') -->

  <!-- =========================================================================

        <polyline points="9 18 15 12 9 6"></polyline>

  <script>
    /**
     * =========================================================================
     * CONFIGURAÇÃO CENTRAL
     * =========================================================================
     */
    const CONFIG = {
      WHATSAPP_NUMBER: "5500000000000",
      WHATSAPP_MESSAGE: "Olá Alan, vi seu portfólio e gostaria de falar sobre um projeto de edição.",
      EMAIL: "alan.d.santos2021@gmail.com",
      INSTAGRAM_URL: "https://instagram.com/seuusuario",
      LINKEDIN_URL: "https://linkedin.com/in/seuusuario",

      // Os 4 vídeos do YouTube
      VIDEOS: [
        {
          type: "video",
          id: "8lmrTdA1EsU",
          title: "Social Media — Edição Dinâmica",
          ratio: "ratio-16-9"
        },
        {
          type: "video",
          id: "0GgqcRnrNhs",
          title: "Social Media — Cortes & Ritmo",
          ratio: "ratio-21-9"
        },
        {
          type: "video",
          id: "Gau-fbkBrrw",
          title: "UGC Campaigns - Brazil",
          ratio: "ratio-4-3"
        },
        {
          type: "video",
          id: "R1g2IAmim6A",
          title: "Medical Explainer Videos",
          ratio: "ratio-16-10"
        }
      ],

      // Trabalhos de Design / Photoshop / IA para enriquecer o ritmo visual da grade
      DESIGN_ITEMS: [
        {
          type: "design",
          title: "Direção Visual & Composição — Photoshop",
          image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1400&q=85",
          ratio: "ratio-4-3"
        },
        {
          type: "design",
          title: "Cenário Editorial — IA + Pós-Produção",
          image: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=85",
          ratio: "ratio-16-9"
        },
        {
          type: "design",
          title: "Arte para Grandes Formatos — 400×300cm",
          image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1400&q=85",
          ratio: "ratio-3-2"
        }
      ]
    };

    // Estado da aplicação
    const state = {
      activeTab: "home",
      currentItems: [],
      lightboxIndex: -1
    };

    // Elementos DOM
    const galleryGrid = document.getElementById("gallery-grid");
    const aboutSection = document.getElementById("about-section");
    const navButtons = document.querySelectorAll(".nav-btn");
    const lightbox = document.getElementById("lightbox");
    const lightboxContent = document.getElementById("lightbox-content");

    /**
     * 1. Inicializa contatos
     */
    function initContacts() {
      const cleanPhone = CONFIG.WHATSAPP_NUMBER.replace(/\D/g, "");
      const waUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(CONFIG.WHATSAPP_MESSAGE)}`;

      const socialWa = document.getElementById("social-whatsapp");
      const socialIg = document.getElementById("social-instagram");
      const socialLi = document.getElementById("social-linkedin");
      const aboutWa = document.getElementById("about-whatsapp");
      const aboutIg = document.getElementById("about-instagram");
      const aboutLi = document.getElementById("about-linkedin");

      if (socialWa) socialWa.href = waUrl;
      if (aboutWa) aboutWa.href = waUrl;
      if (socialIg) socialIg.href = CONFIG.INSTAGRAM_URL;
      if (aboutIg) aboutIg.href = CONFIG.INSTAGRAM_URL;
      if (socialLi) socialLi.href = CONFIG.LINKEDIN_URL;
      if (aboutLi) aboutLi.href = CONFIG.LINKEDIN_URL;

      const emailBtn = document.getElementById("about-email-btn");
      const copyToast = document.getElementById("copy-toast");
      let toastTimer = null;

      if (emailBtn) {
        emailBtn.addEventListener("click", async () => {
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(CONFIG.EMAIL);
            } else {
              const ta = document.createElement("textarea");
              ta.value = CONFIG.EMAIL;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand("copy");
              document.body.removeChild(ta);
            }

            if (copyToast) {
              copyToast.classList.add("is-visible");
              clearTimeout(toastTimer);
              toastTimer = setTimeout(() => {
                copyToast.classList.remove("is-visible");
              }, 2200);
            }
          } catch (e) {
            console.warn("Erro ao copiar e-mail:", e);
          }
        });
      }
    }

    /**
     * 2. Obtém itens com base na aba ativa
     */
    function getItemsForCurrentTab() {
      if (state.activeTab === "videos") return CONFIG.VIDEOS;
      if (state.activeTab === "design") return CONFIG.DESIGN_ITEMS;

      // Na aba 'home', mescla vídeos e design para preencher as 3 colunas harmoniosamente
      const combined = [];
      const videos = CONFIG.VIDEOS;
      const designs = CONFIG.DESIGN_ITEMS;
      let d = 0;

      for (let i = 0; i < videos.length; i++) {
        combined.push(videos[i]);
        if ((i + 1) % 2 === 0 && d < designs.length) {
          combined.push(designs[d++]);
        }
      }
      while (d < designs.length) {
        combined.push(designs[d++]);
      }
      return combined;
    }

    /**
     * 3. Renderiza a grade
     */
    function renderGallery() {
      if (state.activeTab === "sobre") {
        galleryGrid.style.display = "none";
        aboutSection.classList.add("is-visible");
        return;
      }

      aboutSection.classList.remove("is-visible");
      galleryGrid.style.display = "block";
      galleryGrid.innerHTML = "";

      const items = getItemsForCurrentTab();
      state.currentItems = items;

      items.forEach((item, index) => {
        const card = document.createElement("article");
        card.className = `masonry-item ${item.ratio || "ratio-16-9"}`;
        card.style.animationDelay = `${index * 45}ms`;
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", `Abrir: ${item.title}`);

        const isVideo = item.type === "video";
        const thumbUrl = isVideo
          ? `https://i.ytimg.com/vi/${encodeURIComponent(item.id)}/maxresdefault.jpg`
          : item.image;
        const fallbackThumb = isVideo
          ? `https://i.ytimg.com/vi/${encodeURIComponent(item.id)}/hqdefault.jpg`
          : "";

        card.innerHTML = `
          <img
            class="masonry-media"
            src="${thumbUrl}"
            alt="${item.title}"
            loading="lazy"
          />
          ${
            isVideo
              ? `<div class="play-indicator" aria-hidden="true">
                   <svg viewBox="0 0 24 24" fill="currentColor">
                     <polygon points="7 5 19 12 7 19 7 5"></polygon>
                   </svg>
                 </div>`
              : ""
          }
          <div class="masonry-overlay">
            <span class="masonry-title">${item.title}</span>
          </div>
        `;

        if (isVideo) {
          const img = card.querySelector(".masonry-media");
          if (img) {
            img.addEventListener("load", () => {
              if (img.naturalWidth <= 120 && !img.dataset.fallback) {
                img.dataset.fallback = "1";
                img.src = fallbackThumb;
              }
            });
            img.addEventListener("error", () => {
              if (!img.dataset.fallback) {
                img.dataset.fallback = "1";
                img.src = fallbackThumb;
              }
            });
          }
        }

        const openHandler = () => openLightbox(index);
        card.addEventListener("click", openHandler);
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openHandler();
          }
        });

        galleryGrid.appendChild(card);
      });
    }

    /**
     * 4. Lightbox Cinema
     */
    function renderLightboxContent() {
      if (state.lightboxIndex < 0 || state.lightboxIndex >= state.currentItems.length) return;
      const item = state.currentItems[state.lightboxIndex];

      if (item.type === "video") {
        lightboxContent.className = "lightbox-video-wrap";
        // cc_load_policy=0 desativa legendas automáticas; iv_load_policy=3 desativa anotações; modestbranding=1
        const embedUrl = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(item.id)}?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&cc_load_policy=0&playsinline=1`;

        lightboxContent.innerHTML = `
          <iframe
            src="${embedUrl}"
            title="${item.title}"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        `;
      } else {
        lightboxContent.className = "lightbox-image-wrap";
        lightboxContent.innerHTML = `
          <img class="lightbox-image" src="${item.image}" alt="${item.title}" />
        `;
      }
    }

    function openLightbox(index) {
      state.lightboxIndex = index;
      renderLightboxContent();
      lightbox.classList.add("is-open");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightbox.classList.remove("is-open");
      lightboxContent.innerHTML = "";
      document.body.style.overflow = "";
      state.lightboxIndex = -1;
    }

    function stepLightbox(delta) {
      const total = state.currentItems.length;
      if (!total) return;
      state.lightboxIndex = (state.lightboxIndex + delta + total) % total;
      renderLightboxContent();
    }

    function initLightbox() {
      document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
      document.getElementById("lightbox-prev").addEventListener("click", () => stepLightbox(-1));
      document.getElementById("lightbox-next").addEventListener("click", () => stepLightbox(1));

      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLightbox();
      });

      document.addEventListener("keydown", (e) => {
        if (!lightbox.classList.contains("is-open")) return;
        if (e.key === "Escape") closeLightbox();
        if (e.key === "ArrowLeft") stepLightbox(-1);
        if (e.key === "ArrowRight") stepLightbox(1);
      });
    }

    /**
     * 5. Navegação entre abas
     */
    function setActiveTab(tabName) {
      state.activeTab = tabName;
      navButtons.forEach((btn) => {
        btn.classList.toggle("is-active", btn.dataset.tab === tabName);
      });
      renderGallery();
    }

    function initNavigation() {
      navButtons.forEach((btn) => {
        btn.addEventListener("click", () => setActiveTab(btn.dataset.tab));
      });

      const brandHome = document.getElementById("brand-home");
      if (brandHome) {
        brandHome.addEventListener("click", (e) => {
          e.preventDefault();
          setActiveTab("home");
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }
    }

    // Inicialização
    document.addEventListener("DOMContentLoaded", () => {
      initContacts();
      initNavigation();
      initLightbox();
      renderGallery();
    });
  </script>
</body>
</html>
