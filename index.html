  <style>
    /* =========================================================================
       ESTÉTICA EDITORIAL MINIMALISTA (REFERÊNCIA LUCAS GUERRA)
    ========================================================================= */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    :root {
      --bg: #111111;
      --surface: #181818;
      --text: #ffffff;
      --muted: #999999;
      --muted-hover: #e5e5e5;
      --gap: 22px;
      --max-width: 1220px;
      --transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    html {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    ::selection {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }

    /* =========================================================================
       CABEÇALHO EDITORIAL EM 2 NÍVEIS (DIVISÕES PRINCIPAIS + SUBCATEGORIAS)
    ========================================================================= */
    .site-header {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 38px 40px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .header-top {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 28px;
    }

    .brand {
      justify-self: start;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #ffffff;
      transition: opacity var(--transition);
      white-space: nowrap;
    }

    .brand:hover {
      opacity: 0.8;
    }

    .nav-links {
      justify-self: center;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 26px;
    }

    .nav-btn {
      font-size: 0.88rem;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: -0.01em;
      padding: 4px 2px;
      position: relative;
      transition: color var(--transition);
      text-transform: lowercase;
    }

    .nav-btn:hover {
      color: var(--muted-hover);
    }

    .nav-btn.is-active {
      color: #ffffff;
      font-weight: 500;
    }

    .nav-btn.is-active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;
      height: 1.5px;
      background-color: #ffffff;
    }

    /* Subcategorias / Filtros dinâmicos (Linha Inferior) */
    .sub-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 28px;
      transition: opacity var(--transition);
    }

    .sub-nav.is-hidden {
      display: none;
    }

    .sub-btn {
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.01em;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid transparent;
      transition: all var(--transition);
      text-transform: lowercase;
    }

    .sub-btn:hover {
      color: var(--muted-hover);
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .sub-btn.is-active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.22);
      font-weight: 500;
    }

    .social-links {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      opacity: 0.8;
      padding: 4px;
      transition: opacity var(--transition), transform var(--transition);
    }

    .social-link:hover {
      opacity: 1;
      transform: translateY(-1px);
    }

    .social-link svg {
      width: 17px;
      height: 17px;
      display: block;
    }

    /* =========================================================================
       CONTAINER PRINCIPAL & GRADE MASONRY EDITORIAL (3 COLUNAS)
    ========================================================================= */
    .main-container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 40px 96px;
    }

    .masonry-grid {
      column-count: 3;
      column-gap: var(--gap);
    }

    .masonry-item {
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
      margin-bottom: var(--gap);
      position: relative;
      display: block;
      width: 100%;
      overflow: hidden;
      background-color: var(--surface);
      cursor: pointer;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      border-radius: 2px;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Proporções cinematográficas */
    .ratio-16-9  { aspect-ratio: 16 / 9; }
    .ratio-9-16  { aspect-ratio: 4 / 5; } /* Retrato compacto na grade, sem barras pretas */
    .ratio-4-3   { aspect-ratio: 4 / 3; }
    .ratio-21-9  { aspect-ratio: 21 / 9; }
    .ratio-3-2   { aspect-ratio: 3 / 2; }
    .ratio-16-10 { aspect-ratio: 16 / 10; }

    .masonry-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), filter 0.4s ease;
    }

    .masonry-item:hover .masonry-media {
      transform: scale(1.025);
      filter: brightness(0.85);
    }

    /* Overlay minimalista visível apenas no hover */
    .masonry-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.65) 0%,
        rgba(0, 0, 0, 0.05) 50%,
        rgba(0, 0, 0, 0) 100%
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 16px 18px;
      pointer-events: none;
    }

    .masonry-item:hover .masonry-overlay,
    .masonry-item:focus-visible .masonry-overlay {
      opacity: 1;
    }

    .masonry-title {
      font-size: 0.8rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.95);
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 85%;
    }

    .play-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .masonry-item:hover .play-indicator,
    .masonry-item:focus-visible .play-indicator {
      opacity: 0.95;
      transform: translate(-50%, -50%) scale(1);
    }

    .play-indicator svg {
      width: 28px;
      height: 28px;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.6));
    }

    /* =========================================================================
       SEÇÃO SOBRE (MINIMALISTA EDITORIAL — OCULTA POR PADRÃO)
    ========================================================================= */
    .about-section {
      display: none;
      max-width: 640px;
      margin: 64px auto 60px;
      animation: fadeUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .about-section.is-visible {
      display: block;
    }

    .about-text {
      font-size: 1.08rem;
      line-height: 1.8;
      color: #d4d4d4;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .about-text strong {
      color: #ffffff;
      font-weight: 600;
    }

    .about-links {
      margin-top: 48px;
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      align-items: center;
    }

    .about-link {
      font-size: 0.88rem;
      color: var(--muted);
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      padding-bottom: 4px;
      transition: color var(--transition), border-color var(--transition);
    }

    .about-link:hover {
      color: #ffffff;
      border-color: #ffffff;
    }

    .copy-toast {
      font-size: 0.78rem;
      color: #22c55e;
      margin-left: 8px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .copy-toast.is-visible {
      opacity: 1;
    }

    /* =========================================================================
       LIGHTBOX CINEMA (MODAL FULL-SCREEN)
    ========================================================================= */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background-color: rgba(10, 10, 10, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 64px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .lightbox.is-open {
      opacity: 1;
      visibility: visible;
    }

    .lightbox-stage {
      width: 100%;
      max-width: 940px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      transition: max-width 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Formato Vertical Reels no Lightbox — Compacto e Sem Bordas Pretas */
    .lightbox-stage.is-vertical {
      max-width: 330px;
    }

    .lightbox-video-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000000;
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
      border-radius: 6px;
    }

    .lightbox-video-wrap.is-vertical {
      aspect-ratio: 9 / 16;
      max-height: 72vh;
      border-radius: 16px;
      margin: 0 auto;
    }

    /* Vídeos horizontais (16:9) */
    .lightbox-video-wrap iframe {
      position: absolute;
      top: -11%;
      left: 0;
      width: 100%;
      height: 112%;
      border: 0;
    }

    /* Vídeos verticais (9:16) */
    .lightbox-video-wrap.is-vertical iframe {
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .lightbox-image-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-image {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
      display: block;
    }

    .lightbox-close {
      position: fixed;
      top: 24px;
      right: 28px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999999;
      transition: color var(--transition);
      z-index: 105;
    }

    .lightbox-close:hover {
      color: #ffffff;
    }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.55);
      transition: color var(--transition), transform var(--transition);
      z-index: 105;
    }

    .lightbox-nav:hover {
      color: #ffffff;
    }

    .lightbox-prev { left: 16px; }
    .lightbox-next { right: 16px; }

    /* =========================================================================
       RESPONSIVIDADE
    ========================================================================= */
    @media (max-width: 1024px) {
      .site-header {
        padding: 32px 28px 36px;
      }

      .main-container {
        padding: 0 28px 64px;
      }

      .masonry-grid {
        column-count: 2;
        column-gap: 20px;
      }

      .masonry-item {
        margin-bottom: 20px;
      }

      .lightbox {
        padding: 32px 48px;
      }
    }

    @media (max-width: 768px) {
      .site-header {
        padding: 24px 20px 20px;
        gap: 14px;
      }

      .header-top {
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "brand social"
          "nav nav";
        row-gap: 14px;
      }

      .brand {
        grid-area: brand;
      }

      .social-links {
        grid-area: social;
        gap: 14px;
      }

      .nav-links {
        grid-area: nav;
        justify-self: center;
        gap: 18px;
      }

      .sub-nav {
        gap: 8px;
      }

      .main-container {
        padding: 0 20px 56px;
      }

      .masonry-grid {
        column-count: 1;
        column-gap: 0;
      }

      .masonry-item {
        margin-bottom: 18px;
      }

      .about-section {
        margin: 32px auto 40px;
      }

      .lightbox {
        padding: 56px 16px 24px;
      }

      .lightbox-close {
        top: 12px;
        right: 12px;
      }

      .lightbox-nav {
        top: auto;
        bottom: 16px;
        transform: none;
      }

      .lightbox-prev { left: 16px; }
      .lightbox-next { right: 16px; }
    }
  </style>
</head>

    // Subcategorias dinâmicas por divisão principal (ocultas na home e sobre)
    const SUBCATEGORIES = {
      video: [
        { id: "all", label: "todos" },
        { id: "reels", label: "reels" },
        { id: "16:9", label: "16:9" },
        { id: "social-media", label: "social media" },
        { id: "fitness", label: "fitness" },
        { id: "institucional", label: "institucional" }
      ],
      design: [
        { id: "all", label: "todos" },
        { id: "social-media", label: "social media" },
        { id: "identidade", label: "identidade visual" },
        { id: "editorial", label: "editorial" }
      ],
      ia: [
        { id: "all", label: "todos" },
        { id: "video-ia", label: "vídeo ia" },
        { id: "renders", label: "renders" }
      ]
    };

    // Estado da aplicação
    const state = {
      activeCategory: "home",
      activeSubFilter: "all",
      currentItems: [],
      lightboxIndex: -1
    };

    // Elementos DOM
    const galleryGrid = document.getElementById("gallery-grid");
    const aboutSection = document.getElementById("about-section");
    const lightbox = document.getElementById("lightbox");
    const lightboxContent = document.getElementById("lightbox-content");

    /**
     * 1. Inicializa contatos
     */
    function initContacts() {
      const cleanPhone = CONFIG.WHATSAPP_NUMBER.replace(/\D/g, "");
      const waUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(CONFIG.WHATSAPP_MESSAGE)}`;

      const socialWa = document.getElementById("social-whatsapp");
      const socialLi = document.getElementById("social-linkedin");
      const aboutWa = document.getElementById("about-whatsapp");
      const aboutLi = document.getElementById("about-linkedin");

      if (socialWa) socialWa.href = waUrl;
      if (aboutWa) aboutWa.href = waUrl;
      if (socialLi) socialLi.href = CONFIG.LINKEDIN_URL;
      if (aboutLi) aboutLi.href = CONFIG.LINKEDIN_URL;

      const emailBtn = document.getElementById("about-email-btn");
      const copyToast = document.getElementById("copy-toast");
      let toastTimer = null;

      if (emailBtn) {
        emailBtn.addEventListener("click", async () => {
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(CONFIG.EMAIL);
            } else {
              const ta = document.createElement("textarea");
              ta.value = CONFIG.EMAIL;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand("copy");
              document.body.removeChild(ta);
            }

            if (copyToast) {
              copyToast.classList.add("is-visible");
              clearTimeout(toastTimer);
              toastTimer = setTimeout(() => {
                copyToast.classList.remove("is-visible");
              }, 2200);
            }
          } catch (e) {
            console.warn("Erro ao copiar e-mail:", e);
          }
        });
      }
    }

    /**
     * 2. Subcategorias dinâmicas (Linha Inferior)
     */
    function renderSubNav() {
      const subNav = document.getElementById("sub-nav");
      if (!subNav) return;

      // Na home e no sobre, a barra de subcategorias fica oculta
      if (state.activeCategory === "home" || state.activeCategory === "sobre") {
        subNav.classList.add("is-hidden");
        subNav.innerHTML = "";
        return;
      }

      const filters = SUBCATEGORIES[state.activeCategory] || [];
      if (filters.length === 0) {
        subNav.classList.add("is-hidden");
        subNav.innerHTML = "";
        return;
      }

      subNav.classList.remove("is-hidden");
      subNav.innerHTML = filters
        .map(
          (f) =>
            `<button type="button" class="sub-btn ${f.id === state.activeSubFilter ? "is-active" : ""}" data-subfilter="${f.id}">${f.label}</button>`
        )
        .join("");

      subNav.querySelectorAll(".sub-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          setSubFilter(btn.dataset.subfilter);
        });
      });
    }

    /**
     * 3. Obtém itens filtrados por Categoria + Subfiltro
     */
    function getFilteredItems() {
      let list = CONFIG.PROJECTS;

      if (state.activeCategory !== "home") {
        list = list.filter((item) => item.category === state.activeCategory);
      }

      if (state.activeSubFilter !== "all") {
        list = list.filter(
          (item) => item.tags && item.tags.includes(state.activeSubFilter)
        );
      }

      return list;
    }

    /**
     * 4. Renderiza a grade
     */
    function renderGallery() {
      if (state.activeCategory === "sobre") {
        galleryGrid.style.display = "none";
        aboutSection.classList.add("is-visible");
        return;
      }

      aboutSection.classList.remove("is-visible");
      galleryGrid.style.display = "block";
      galleryGrid.innerHTML = "";

      const items = getFilteredItems();
      state.currentItems = items;

      items.forEach((item, index) => {
        const isVideo = item.type === "video";
        const card = document.createElement("article");
        card.className = `masonry-item ${item.ratio || "ratio-9-16"}`;
        card.style.animationDelay = `${index * 35}ms`;
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", `${isVideo ? "Assistir" : "Ver"}: ${item.title}`);

        card.dataset.tags = (item.tags || []).join(" ");
        card.dataset.category = item.category || "";

        const thumbUrl = isVideo
          ? `https://i.ytimg.com/vi/${encodeURIComponent(item.id)}/maxresdefault.jpg`
          : item.image;
        const fallbackThumb = isVideo
          ? `https://i.ytimg.com/vi/${encodeURIComponent(item.id)}/hqdefault.jpg`
          : item.image;

        card.innerHTML = `
          <img
            class="masonry-media"
            src="${thumbUrl}"
            alt="${item.title}"
            loading="lazy"
          />
          ${
            isVideo
              ? `<div class="play-indicator" aria-hidden="true">
                   <svg viewBox="0 0 24 24" fill="currentColor">
                     <polygon points="7 5 19 12 7 19 7 5"></polygon>
                   </svg>
                 </div>`
              : ""
          }
          <div class="masonry-overlay">
            <span class="masonry-title">${item.title}</span>
          </div>
        `;

        if (isVideo) {
          const img = card.querySelector(".masonry-media");
          if (img) {
            img.addEventListener("load", () => {
              if (img.naturalWidth <= 120 && !img.dataset.fallback) {
                img.dataset.fallback = "1";
                img.src = fallbackThumb;
              }
            });
            img.addEventListener("error", () => {
              if (!img.dataset.fallback) {
                img.dataset.fallback = "1";
                img.src = fallbackThumb;
              }
            });
          }
        }

        const openHandler = () => openLightbox(index);
        card.addEventListener("click", openHandler);
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openHandler();
          }
        });

        galleryGrid.appendChild(card);
      });
    }

    /**
     * 5. Lightbox Cinema Adaptável (Compacto 9:16, Widescreen 16:9 ou Imagem)
     */
    function renderLightboxContent() {
      if (state.lightboxIndex < 0 || state.lightboxIndex >= state.currentItems.length) return;
      const item = state.currentItems[state.lightboxIndex];
      const isVideo = item.type === "video";
      const isVertical = item.aspect === "9:16" || item.ratio === "ratio-9-16";
      const lightboxStage = document.querySelector(".lightbox-stage");

      if (isVideo) {
        if (lightboxStage) {
          lightboxStage.classList.toggle("is-vertical", isVertical);
        }
        lightboxContent.className = `lightbox-video-wrap ${isVertical ? "is-vertical" : ""}`;
        const embedUrl = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(item.id)}?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&cc_load_policy=0&playsinline=1`;

        lightboxContent.innerHTML = `
          <iframe
            src="${embedUrl}"
            title="${item.title}"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        `;
      } else {
        if (lightboxStage) {
          lightboxStage.classList.remove("is-vertical");
        }
        lightboxContent.className = "lightbox-image-wrap";
        lightboxContent.innerHTML = `
          <img class="lightbox-image" src="${item.image}" alt="${item.title}" />
        `;
      }
    }

    function openLightbox(index) {
      state.lightboxIndex = index;
      renderLightboxContent();
      lightbox.classList.add("is-open");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightbox.classList.remove("is-open");
      lightboxContent.innerHTML = "";
      const lightboxStage = document.querySelector(".lightbox-stage");
      if (lightboxStage) {
        lightboxStage.classList.remove("is-vertical");
      }
      document.body.style.overflow = "";
      state.lightboxIndex = -1;
    }

    function stepLightbox(delta) {
      const total = state.currentItems.length;
      if (!total) return;
      state.lightboxIndex = (state.lightboxIndex + delta + total) % total;
      renderLightboxContent();
    }

    function initLightbox() {
      document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
      document.getElementById("lightbox-prev").addEventListener("click", () => stepLightbox(-1));
      document.getElementById("lightbox-next").addEventListener("click", () => stepLightbox(1));

      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLightbox();
      });

      document.addEventListener("keydown", (e) => {
        if (!lightbox.classList.contains("is-open")) return;
        if (e.key === "Escape") closeLightbox();
        if (e.key === "ArrowLeft") stepLightbox(-1);
        if (e.key === "ArrowRight") stepLightbox(1);
      });
    }

    /**
     * 6. Controle de Categoria Principal & Subfiltro
     */
    function setCategory(category) {
      state.activeCategory = category;
      state.activeSubFilter = "all";

      const catButtons = document.querySelectorAll("#category-nav .nav-btn");
      catButtons.forEach((btn) => {
        btn.classList.toggle("is-active", btn.dataset.category === category);
      });

      renderSubNav();
      renderGallery();
    }

    function setSubFilter(subfilter) {
      state.activeSubFilter = subfilter;

      const subButtons = document.querySelectorAll("#sub-nav .sub-btn");
      subButtons.forEach((btn) => {
        btn.classList.toggle("is-active", btn.dataset.subfilter === subfilter);
      });

      renderGallery();
    }

    function initNavigation() {
      const categoryButtons = document.querySelectorAll("#category-nav .nav-btn");
      categoryButtons.forEach((btn) => {
        btn.addEventListener("click", () => setCategory(btn.dataset.category));
      });

      const brandHome = document.getElementById("brand-home");
      if (brandHome) {
        brandHome.addEventListener("click", (e) => {
          e.preventDefault();
          setCategory("home");
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }
    }

    // Inicialização
    document.addEventListener("DOMContentLoaded", () => {
      initContacts();
      initNavigation();
      initLightbox();
      renderSubNav();
      renderGallery();
    });
  </script>
